# JazzHub Nginx Production Reverse Proxy Configuration
# Deploy path: /etc/nginx/sites-available/jazzhub
# Symlink to: /etc/nginx/sites-enabled/jazzhub

server {
    listen 80;
    server_name _; # Responds to EC2 Public IP or your custom domain

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Serve React Production Build
    # NOTE: Default deployment path is /var/www/jazzhub. If you cloned to /home/ubuntu/jazzhub,
    # update this path to: root /home/ubuntu/jazzhub/client/dist;
    root /var/www/jazzhub/client/dist;
    index index.html;

    client_max_body_size 20M;

    # Static Assets Caching (1 year cache for hashed files in /assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. Reverse Proxy for Node.js Express Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Connection & Header forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Support React Router Single Page Application Routing
    # Any route like /popular, /movie/123, /watchlist falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
